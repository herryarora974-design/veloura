<!DOCTYPE html>
<html>
<head>
<title>Veloura Products</title>
<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#d4af37;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#1a1a1a;
padding:15px;
border-radius:15px;
text-align:center;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#d4af37;
font-size:20px;
margin:10px 0;
}

button{
background:#d4af37;
border:none;
padding:10px 20px;
border-radius:25px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>Veloura Collection</h1>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800">
<h3>Premium T-Shirt</h3>
<p class="price">₹999</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800">
<h3>Luxury Sneakers</h3>
<p class="price">₹2499</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800">
<h3>Beauty Serum</h3>
<p class="price">₹799</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?w=800">
<h3>Fashion Collection</h3>
<p class="price">₹1499</p>
<button>Buy Now</button>
</div>

</div>

</body>
</html>
