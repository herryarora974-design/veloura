<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veloura Marketplace</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#131921;
padding:12px;
color:white;
position:sticky;
top:0;
z-index:1000;
}

.topbar{
display:flex;
align-items:center;
gap:10px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ff9900;
}

.search{
flex:1;
padding:12px;
border:none;
border-radius:4px;
}

.cart{
font-size:22px;
}

.categories{
background:#232f3e;
display:flex;
overflow:auto;
padding:12px;
gap:20px;
}

.categories a{
color:white;
text-decoration:none;
white-space:nowrap;
}

.hero{
height:250px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(135deg,#ff9900,#ff6b00);
color:white;
padding:20px;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:28px;
margin:20px;
color:#131921;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.price{
color:#ff6b00;
font-weight:bold;
margin-top:5px;
}

.buy-btn{
background:#ff9900;
color:black;
border:none;
padding:10px;
width:100%;
margin-top:10px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<div class="topbar">
<div class="logo">VELOURA</div>
<input type="text" class="search" placeholder="Search products...">
<div class="cart">🛒</div>
</div>
</header>

<div class="categories">
<a href="#">Fashion</a>
<a href="#">Beauty</a>
<a href="#">Electronics</a>
<a href="#">Home</a>
<a href="#">Kitchen</a>
<a href="#">Accessories</a>
<a href="#">Deals</a>
<a href="#">New Arrivals</a>
</div>

<section class="hero">
<div>
<h1>Welcome to Veloura</h1>
<p>Fashion, Beauty, Electronics & More</p>
</div>
</section>

<h2 class="section-title">Deals of the Day</h2>
