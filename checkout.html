<!DOCTYPE html>
<html>
<head>
<title>Checkout - Veloura</title>
<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h1{
text-align:center;
}

input, textarea, select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:15px;
background:#ff9900;
border:none;
font-size:18px;
font-weight:bold;
border-radius:5px;
}

</style>
</head>

<body>

<div class="container">

<h1>Checkout</h1>

  <input id="full_name" type="text" placeholder="Full Name">

<input id="mobile" type="tel" placeholder="Mobile Number">

<input id="email" type="email" placeholder="Email Address">

<textarea id="address" placeholder="Full Address"></textarea>

<input id="city" type="text" placeholder="City">

<input id="state" type="text" placeholder="State">

<input id="pincode" type="text" placeholder="Pincode">

<select id="payment_method">
  <option>Cash on Delivery</option>
  <option>UPI</option>
  <option>Credit/Debit Card</option>
</select>

<button type="button" onclick="placeOrder()">Place Order</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://uinzlgwhntwqexlqjiuq.supabase.co";
const supabaseKey = "sb_publishable_EJvv6XPN71nwi4PqZYhvEQ_7so7-xs6";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function placeOrder() {

  try {

    const full_name = document.getElementById("full_name").value;
    const mobile = document.getElementById("mobile").value;
    const email = document.getElementById("email").value;
    const address = document.getElementById("address").value;
    const city = document.getElementById("city").value;
    const state = document.getElementById("state").value;
    const pincode = document.getElementById("pincode").value;
    const payment_method = document.getElementById("payment_method").value;

    const { data, error } = await supabase
      .from("orders")
      .insert([
        {
          full_name,
          mobile,
          email,
          address,
          city,
          state,
          pincode,
          payment_method
        }
      ]);

    if (error) {
      alert("Error: " + error.message);
      console.log(error);
    } else {
      alert("Order placed successfully!");
      console.log(data);
    }

  } catch(err) {
    alert("JS Error: " + err.message);
    console.log(err);
  }
}
</script>
</body>
</html>
