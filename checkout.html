<!DOCTYPE html>
<html>
<head>
<title>Checkout - Veloura</title>
<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h1{
text-align:center;
}

input, textarea, select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:15px;
background:#ff9900;
border:none;
font-size:18px;
font-weight:bold;
border-radius:5px;
}

</style>
</head>

<body>

<div class="container">

<h1>Checkout</h1>

<input type="text" placeholder="Full Name">

<input type="tel" placeholder="Mobile Number">

<input type="email" placeholder="Email Address">

<textarea placeholder="Full Address"></textarea>

<input type="text" placeholder="City">

<input type="text" placeholder="State">

<input type="text" placeholder="Pincode">

<select>
<option>Cash on Delivery</option>
<option>UPI</option>
<option>Credit/Debit Card</option>
</select>

<button>Place Order</button>

</div>

</body>
</html>
