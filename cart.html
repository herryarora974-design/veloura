<!DOCTYPE html>
<html>
<head>
<title>Veloura Cart</title>
<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#131921;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:20px;
}

.cart-item{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.price{
color:#ff6b00;
font-weight:bold;
}

.total{
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.checkout{
width:100%;
padding:15px;
background:#ff9900;
border:none;
font-size:18px;
font-weight:bold;
margin-top:20px;
border-radius:8px;
}

</style>
</head>

<body>

<header>
<h1>🛒 Your Cart</h1>
</header>

<div class="container">

<div class="cart-item">
<h3>Wireless Earbuds</h3>
<p class="price">₹1499</p>
</div>

<div class="cart-item">
<h3>Premium T-Shirt</h3>
<p class="price">₹699</p>
</div>

<div class="total">
Total: ₹2198
</div>

<button class="checkout">
Proceed to Checkout
</button>

</div>

</body>
</html>
